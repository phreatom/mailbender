services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mailagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
  scheduler:
    build: .
    command: ["mailagent", "scheduler"]
    env_file: .env
    depends_on:
      - postgres
volumes:
  pgdata:
