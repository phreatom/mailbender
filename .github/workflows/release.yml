name: Release

# Build the distribution packages (sdist + wheel) and attach them to a GitHub
# Release. Pushing a semver tag (e.g. `v0.1.0`) cuts the release; a manual
# `workflow_dispatch` run just builds and uploads the artifacts for inspection.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the built distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mailbender-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
