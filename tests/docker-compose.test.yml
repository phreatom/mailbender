services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailagent_test
    ports:
      - "55432:5432"
  greenmail:
    image: greenmail/standalone:2.0.1
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=me:secret@example.com -Dgreenmail.verbose"
    ports:
      - "53143:3143"  # imap
      - "53025:3025"  # smtp
