[alembic]
script_location = migrations
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/mailbender

# Logging configuration. migrations/env.py calls logging.config.fileConfig on
# this file, which requires the [loggers]/[handlers]/[formatters] trio below to
# exist (otherwise it raises KeyError). These are the standard Alembic defaults.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
